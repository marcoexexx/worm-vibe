[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/physics",
    "crates/ai",
    "crates/app",
    "crates/infra",
    "crates/input",
    "crates/rendering",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aung Koko Lwin <toyko2001@gmail.com>"]
repository = "https://github.com/marcoexexx/worm-vibe"
description = "A slither.io-inspired snake game built with Rust and Bevy"

[workspace.dependencies]
bevy = "0.15"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
